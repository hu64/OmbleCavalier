[project]
name = "nnue-training"
version = "0.1.0"
description = "NNUE training pipeline for OmbleCavalier chess engines"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "chess>=1.10",
    "numpy>=1.24",
    "zstandard>=0.21",
    "tqdm>=4.65",
]

[project.scripts]
prepare-data = "prepare_data:main"
train-nnue   = "train:main"
export-nnue  = "export:main"
validate-nnue = "validate:main"

[tool.uv]
dev-dependencies = []

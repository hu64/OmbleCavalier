name: Release

on:
  push:
    branches: [ master ]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate CalVer version
        id: gen
        run: |
          DATE=$(date -u "+%Y.%-m.%-d")
          COUNT=$(git rev-list --count HEAD)
          echo "version=${DATE}.${COUNT}" >> "$GITHUB_OUTPUT"

  build-cpp:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B src/OmbleCavalierPlusPlus/build -S src/OmbleCavalierPlusPlus -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build src/OmbleCavalierPlusPlus/build --parallel --target omble_cavalier++

      - name: Test
        run: ctest --test-dir src/OmbleCavalierPlusPlus/build --output-on-failure

      - name: Stage artifact
        run: cp src/OmbleCavalierPlusPlus/build/omble_cavalier++ omble_cavalier++_linux_x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: cpp-binary
          path: omble_cavalier++_linux_x86_64

  build-python:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Build standalone
        run: uv run pyinstaller omble_cavalier.spec --distpath dist

      - name: Stage artifact
        run: cp dist/omble_cavalier omble_cavalier_python_linux_x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: python-binary
          path: omble_cavalier_python_linux_x86_64

  release:
    needs: [version, build-cpp, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpp-binary

      - uses: actions/download-artifact@v4
        with:
          name: python-binary

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: OmbleCavalier v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            omble_cavalier++_linux_x86_64
            omble_cavalier_python_linux_x86_64
